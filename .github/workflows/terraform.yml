# Reusable workflow: plan on every run, apply only a reviewed plan.
#
#   jobs:
#     infra:
#       uses: pavangajjala/cicd-pipeline-library/.github/workflows/terraform.yml@v1
#       permissions:
#         contents: read
#         id-token: write
#       with:
#         working-directory: infra
#         environment: prod
#         aws-role-arn: arn:aws:iam::111111111111:role/github-deploy
#         apply: ${{ github.ref == 'refs/heads/main' }}
name: Terraform

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the root configuration
        required: true
        type: string
      environment:
        description: GitHub environment for the apply job. Add required reviewers there to gate applies.
        required: true
        type: string
      aws-role-arn:
        description: IAM role assumed through OIDC
        required: true
        type: string
      aws-region:
        type: string
        default: eu-west-1
      terraform-version:
        type: string
        default: "1.17.1"
      var-file:
        description: Optional tfvars file, relative to working-directory
        type: string
        default: ""
      backend-config:
        description: Optional backend config file, relative to working-directory
        type: string
        default: ""
      apply:
        description: Apply the plan after it succeeds (and after environment approval)
        type: boolean
        default: false
      vaultscan-gate:
        description: Fail the plan job if VaultScan blocks the change
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      has-changes: ${{ steps.plan.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Init
        env:
          BACKEND_CONFIG: ${{ inputs.backend-config }}
        run: |
          args=(-input=false)
          if [ -n "$BACKEND_CONFIG" ]; then args+=("-backend-config=$BACKEND_CONFIG"); fi
          terraform init "${args[@]}"

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        env:
          VAR_FILE: ${{ inputs.var-file }}
        run: |
          args=(-input=false -out=tfplan -detailed-exitcode)
          if [ -n "$VAR_FILE" ]; then args+=("-var-file=$VAR_FILE"); fi
          set +e
          terraform plan "${args[@]}"
          code=$?
          set -e
          # -detailed-exitcode: 0 = no changes, 2 = changes, anything else = error
          case "$code" in
            0) echo "has-changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has-changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac
          terraform show -json tfplan > plan.json

      - name: Plan summary
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          {
            echo "### Terraform plan: ${ENVIRONMENT}"
            echo ""
            echo '```'
            terraform show -no-color tfplan | grep -E '^(Plan:|No changes|  # )' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v7
        if: inputs.vaultscan-gate
        with:
          python-version: "3.12"

      - name: Gate the plan with VaultScan
        if: inputs.vaultscan-gate
        run: |
          pip install --quiet git+https://github.com/vaultscanhq/vaultscan-community.git
          vaultscan plan plan.json --format markdown --output "$GITHUB_STEP_SUMMARY"

      # The apply job uses this exact file, so what was reviewed is what runs.
      - uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ inputs.working-directory }}/tfplan
          retention-days: 5

  apply:
    name: Apply (${{ inputs.environment }})
    needs: plan
    if: inputs.apply && needs.plan.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-apply-${{ inputs.environment }}
      cancel-in-progress: false # never interrupt an apply halfway
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Init
        env:
          BACKEND_CONFIG: ${{ inputs.backend-config }}
        run: |
          args=(-input=false)
          if [ -n "$BACKEND_CONFIG" ]; then args+=("-backend-config=$BACKEND_CONFIG"); fi
          terraform init "${args[@]}"

      - uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ inputs.working-directory }}

      - name: Apply the reviewed plan
        run: terraform apply -input=false tfplan
